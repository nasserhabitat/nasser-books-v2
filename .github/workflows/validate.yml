name: Validate library
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/search-normalization.cjs
      - run: node tests/search-results.cjs
      - run: node tests/library-integrity.cjs
